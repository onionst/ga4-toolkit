name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.9.22
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Run offline example
        run: uv run --locked python examples/offline_report.py
      - name: Build distributions
        run: uv build
      - name: Verify packaged entry points
        run: |
          uv venv --python "${{ matrix.python }}" .wheel-check
          uv pip install --python .wheel-check/bin/python dist/*.whl
          .wheel-check/bin/ga4 --version
          .wheel-check/bin/python -m unittest discover -s tests -v
